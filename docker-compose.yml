services:
  db:
    image: postgres:16
    container_name: kanban-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
      POSTGRES_DB: kanban
    ports:
      - "5432:5432"
    volumes:
      - kanban-db-data:/var/lib/postgresql/data

volumes:
  kanban-db-data:
